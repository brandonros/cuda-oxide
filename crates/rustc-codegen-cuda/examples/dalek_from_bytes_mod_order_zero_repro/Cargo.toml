[package]
name = "dalek_from_bytes_mod_order_zero_repro"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

# Runtime known-failure repro for `curve25519_dalek::Scalar::
# from_bytes_mod_order([0u8; 32]).to_bytes()` returning bytes that
# differ from `[0u8; 32]` on device.
#
# Mirrors vanity-miner-rs self_test slot 102. One altitude up from
# slot 112: `from_bytes_mod_order` DOES call `reduce()` (unlike
# `from_canonical_bytes`), so this exercises the Montgomery-reduce
# pipeline. Input is all-zero, so reduction is a no-op and the result
# must round-trip to `[0; 32]`.
#
# Passing baseline: slot 117 (`full reduce pipeline (zero in)`) runs the
# verbatim Scalar52 port through the same reduce path inside the test
# crate and PASSES. The failing crossover is specifically real
# curve25519_dalek's `from_bytes_mod_order` entry point.
#
# Build with:
#   cargo oxide build dalek_from_bytes_mod_order_zero_repro
#
# No fix yet — documents cross-crate monomorphization bug in
# curve25519_dalek's Scalar entry points.

[dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables"] }

cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = { path = "../../../cuda-core" }
