[package]
name = "dalek_edwards_mul_base_one_repro"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

# Runtime known-failure repro for `curve25519_dalek::EdwardsPoint::
# mul_base(&Scalar::from_bytes_mod_order([1, 0, ..., 0]))
# .compress().to_bytes()` not equalling the well-known ed25519 basepoint
# encoding on device.
#
# Mirrors vanity-miner-rs self_test slot 72. Full fixed-base scalar-mult
# path with the smallest non-trivial scalar.
#
# 70 (clamp_integer) PASSes. 71 (from_bytes_mod_order round-trip) FAILs.
# If this also FAILs, mul_base's failure is likely downstream of the
# scalar construction (same root cause as 71). If 71 starts passing
# and 72 still FAILs, the bug is in mul_base / EdwardsPoint /
# compress() instead.
#
# Build with:
#   cargo oxide build dalek_edwards_mul_base_one_repro
#
# No fix yet — documents cross-crate monomorphization bug in
# curve25519_dalek's Scalar / Edwards entry points.

[dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables"] }

cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = { path = "../../../cuda-core" }
