[package]
name = "k256_encoded_point_replica_repro"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

# PASSING-TWIN repro: hand-rolled re-implementation of sec1's
# `EncodedPoint::from_affine_coordinates` body using raw `[u8; 33]` and
# `bool` instead of `GenericArray<u8, U33>` / `subtle::Choice`. Same
# secp256k1 generator inputs as
# `k256_encoded_point_from_affine_coords_repro` (slot 96, FAILing).
#
# Mirrors vanity-miner-rs self_test slot 100, which PASSes on real
# hardware. Purpose: provide a passing baseline whose PTX can be
# diffed against the failing twin to localize the cross-crate
# monomorphization bug. The algorithm is identical; only the type
# machinery differs.
#
# Build with:
#   cargo run -p cargo-oxide -- build k256_encoded_point_replica_repro
#
# PTX diff workflow:
#   diff -u \
#     <(awk '/Begin function .*__check/,/End function .*__check/' \
#         k256_encoded_point_from_affine_coords_repro/*.ptx) \
#     <(awk '/Begin function .*__check/,/End function .*__check/' \
#         k256_encoded_point_replica_repro/*.ptx)
#
# This example has NO dependency on `k256` — that's the point.

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = { path = "../../../cuda-core" }
