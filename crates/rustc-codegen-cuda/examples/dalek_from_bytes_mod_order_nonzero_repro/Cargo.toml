[package]
name = "dalek_from_bytes_mod_order_nonzero_repro"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

# Runtime known-failure repro for `curve25519_dalek::Scalar::
# from_bytes_mod_order([1, 0, ..., 0]).to_bytes()` returning bytes that
# differ from `[1, 0, ..., 0]` on device.
#
# Mirrors vanity-miner-rs self_test slot 71. Same path as
# `dalek_from_bytes_mod_order_zero_repro` (slot 102) but with a non-
# zero input. `1 < ℓ` so reduction is still a no-op and the round-trip
# must preserve the input.
#
# If 102 and 71 both fail, the bug is value-independent (any
# from_bytes_mod_order call mis-round-trips). If 102 fails and 71
# passes, the bug is zero-specific (suggests a zero-special-case
# codegen path). Self_test currently shows BOTH failing.
#
# Build with:
#   cargo oxide build dalek_from_bytes_mod_order_nonzero_repro
#
# No fix yet — documents cross-crate monomorphization bug in
# curve25519_dalek's Scalar entry points.

[dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables"] }

cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = { path = "../../../cuda-core" }
